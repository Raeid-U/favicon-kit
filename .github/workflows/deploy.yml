name: Deploy Favicon Kit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static deployment folder
        run: |
          mkdir -p _site
          cp index.html main.js style.css mark.svg _site/
          cp -R lib _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/lib/pack.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
